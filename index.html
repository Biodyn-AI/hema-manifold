<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hematopoiesis Manifold Viewer</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1e2530;
      --muted: #5b6777;
      --accent: #0b7fab;
      --accent-2: #0e9c6a;
      --border: #d8dee8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    .wrap {
      max-width: 1400px;
      margin: 0 auto;
      padding: 16px;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 6px 18px rgba(20, 30, 48, 0.06);
    }
    h1 {
      margin: 0 0 6px;
      font-size: 24px;
      line-height: 1.2;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }
    .controls {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    button {
      appearance: none;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 14px;
      cursor: pointer;
    }
    button.active {
      color: #fff;
      border-color: transparent;
      background: var(--accent);
    }
    button[data-view="dual"].active {
      background: var(--accent-2);
    }
    a {
      color: var(--accent);
      text-decoration: none;
      font-size: 14px;
    }
    a:hover { text-decoration: underline; }
    iframe {
      width: 100%;
      height: calc(100vh - 180px);
      min-height: 620px;
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-top: 12px;
      background: #fff;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <h1>Hematopoiesis Manifold Viewer</h1>
      <p>Switch between the original figure and the new dual-lens figure.</p>
      <div class="controls">
        <button id="btn-old" data-view="old">Original Interactive Figure</button>
        <button id="btn-dual" data-view="dual">New Dual-Lens Interactive Figure</button>
        <a id="open-link" href="hematopoiesis_map_dual_lens_interactive_3d.html" target="_blank" rel="noopener">Open current view in a new tab</a>
      </div>
      <iframe
        id="viewer"
        src="hematopoiesis_map_dual_lens_interactive_3d.html"
        title="Hematopoiesis manifold interactive figure"
        loading="eager"
      ></iframe>
    </div>
  </div>

  <script>
    const views = {
      old: "hematopoiesis_map_unseen_immune_cells_interactive_3d.html",
      dual: "hematopoiesis_map_dual_lens_interactive_3d.html"
    };

    const viewer = document.getElementById("viewer");
    const openLink = document.getElementById("open-link");
    const buttons = {
      old: document.getElementById("btn-old"),
      dual: document.getElementById("btn-dual")
    };

    function setView(key) {
      const file = views[key] || views.dual;
      viewer.src = file;
      openLink.href = file;
      Object.entries(buttons).forEach(([k, btn]) => {
        if (!btn) return;
        btn.classList.toggle("active", k === key);
      });
    }

    buttons.old.addEventListener("click", () => setView("old"));
    buttons.dual.addEventListener("click", () => setView("dual"));

    setView("dual");
  </script>
</body>
</html>
