<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hematopoiesis Manifold Viewer</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1e2530;
      --muted: #5b6777;
      --accent: #0b7fab;
      --accent-2: #0e9c6a;
      --border: #d8dee8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    .wrap {
      max-width: 1400px;
      margin: 0 auto;
      padding: 16px;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 6px 18px rgba(20, 30, 48, 0.06);
    }
    h1 {
      margin: 0 0 6px;
      font-size: 24px;
      line-height: 1.2;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }
    .controls {
      margin-top: 12px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 8px;
      align-items: center;
    }
    button {
      appearance: none;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 14px;
      cursor: pointer;
      text-align: left;
    }
    button.active {
      color: #fff;
      border-color: transparent;
      background: var(--accent);
    }
    button[data-view="dual"].active {
      background: var(--accent-2);
    }
    a {
      color: var(--accent);
      text-decoration: none;
      font-size: 14px;
    }
    .open-link {
      grid-column: 1 / -1;
      margin-top: 2px;
      display: inline-block;
    }
    a:hover { text-decoration: underline; }
    .view-meta {
      margin-top: 10px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fafcff;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
    }
    .view-meta strong {
      color: var(--text);
    }
    iframe {
      width: 100%;
      height: clamp(460px, 72vh, 980px);
      min-height: 460px;
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-top: 12px;
      background: #fff;
    }
    @media (max-width: 900px) {
      .wrap {
        padding: 10px;
      }
      .panel {
        padding: 10px;
      }
      h1 {
        font-size: 20px;
      }
      .controls {
        grid-template-columns: 1fr;
      }
      button {
        width: 100%;
      }
      iframe {
        height: 72vh;
        min-height: 420px;
      }
    }
    @media (max-width: 540px) {
      iframe {
        height: 68vh;
        min-height: 360px;
      }
      .view-meta {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <h1>Hematopoiesis Manifold Viewer</h1>
      <p>Compare five interactive hematopoiesis maps: dataset-fitted, zero-shot transfer, cell-trained transfer, topology-emphasized hybrid, and best single-head transfer.</p>
      <div class="controls">
        <button id="btn-old" data-view="old">Dataset-Fitted Map (trained on this dataset)</button>
        <button id="btn-dual" data-view="dual">Zero-Shot Transfer Map (no external retraining)</button>
        <button id="btn-cell" data-view="cell">Cell-Trained Zero-Shot Map (trained on internal cells)</button>
        <button id="btn-hybrid" data-view="hybrid">Hybrid Topology Map (strong topology sweep)</button>
        <button id="btn-single" data-view="single">Best Single-Head Map (Layer 2 / Head 5)</button>
        <a class="open-link" id="open-link" href="hematopoiesis_map_hybrid_topology_interactive_3d.html" target="_blank" rel="noopener">Open current view in a new tab</a>
      </div>
      <div id="view-description" class="view-meta"></div>
      <iframe
        id="viewer"
        src="hematopoiesis_map_hybrid_topology_interactive_3d.html"
        title="Hematopoiesis manifold interactive figure"
        loading="eager"
      ></iframe>
    </div>
  </div>

  <script>
    const views = {
      old: {
        file: "hematopoiesis_map_unseen_immune_cells_interactive_3d.html",
        title: "Dataset-Fitted Map (trained on this dataset)",
        description: "Projection head is fitted with this dataset's structure, then visualized with the interactive manifold controls."
      },
      dual: {
        file: "hematopoiesis_map_dual_lens_interactive_3d.html",
        title: "Zero-Shot Transfer Map (no external retraining)",
        description: "Projection head is transferred without retraining on this dataset; dual-lens controls improve CD4/CD8 and Monocyte/Macrophage readability."
      },
      cell: {
        file: "hematopoiesis_map_cell_trained_zero_shot_interactive_3d.html",
        title: "Cell-Trained Zero-Shot Map (trained on internal cells)",
        description: "Projection head is trained on internal Tabula Sapiens cell-level labels, then transferred zero-shot; this map tends to strengthen global CD4/CD8 and Monocyte/Macrophage separability."
      },
      hybrid: {
        file: "hematopoiesis_map_hybrid_topology_interactive_3d.html",
        title: "Hybrid Topology Map (strong topology sweep)",
        description: "Hybrid head combines cell-level training with anchor-topology preservation; this view emphasizes clearer developmental branch structure while retaining strong subtype separation."
      },
      single: {
        file: "hematopoiesis_map_single_head_l2h5_interactive_3d.html",
        title: "Best Single-Head Map (Layer 2 / Head 5)",
        description: "This map uses one attention unit (Layer 2, Head 5) selected by head attribution; inside the figure dropdown, dual-lens modes improve CD4/CD8 and Monocyte/Macrophage separation while preserving the same zero-shot head."
      }
    };

    const viewer = document.getElementById("viewer");
    const openLink = document.getElementById("open-link");
    const viewDescription = document.getElementById("view-description");
    const buttons = {
      old: document.getElementById("btn-old"),
      dual: document.getElementById("btn-dual"),
      cell: document.getElementById("btn-cell"),
      hybrid: document.getElementById("btn-hybrid"),
      single: document.getElementById("btn-single")
    };

    function setView(key) {
      const selected = views[key] || views.dual;
      viewer.src = selected.file;
      openLink.href = selected.file;
      viewDescription.innerHTML = `<strong>${selected.title}</strong><br>${selected.description}`;
      Object.entries(buttons).forEach(([k, btn]) => {
        if (!btn) return;
        btn.classList.toggle("active", k === key);
      });
    }

    buttons.old.addEventListener("click", () => setView("old"));
    buttons.dual.addEventListener("click", () => setView("dual"));
    buttons.cell.addEventListener("click", () => setView("cell"));
    buttons.hybrid.addEventListener("click", () => setView("hybrid"));
    buttons.single.addEventListener("click", () => setView("single"));

    setView("hybrid");
  </script>
</body>
</html>
